<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendar reunión — Julián</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brown: #61412D;
      --cream: #FCF2E8;
      --orange: #FE5538;
      --navy: #040D2A;
      --brown-light: rgba(97,65,45,0.15);
      --brown-mid: rgba(97,65,45,0.35);
    }

    body {
      font-family: "Apercu Pro", "Apercu", "Inter", -apple-system, sans-serif;
      background: transparent;
      color: var(--brown);
      font-size: 15px;
      line-height: 1.5;
    }

    .booking {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    /* ── Steps ── */
    .step { display: none; }
    .step.active { display: block; }

    /* ── Step 1: calendar ── */
    .hc-head { margin-bottom: 24px; }
    .hc-title {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--brown);
      margin-bottom: 10px;
      /* Break the line evenly instead of leaving one word hanging. */
      text-wrap: balance;
    }
    .hc-sub { font-size: 13px; line-height: 1.45; color: var(--brown-mid); letter-spacing: 0.01em; }

    /* Shortcut to the soonest open time: one tap straight to the contact form. */
    .next-slot {
      display: none;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding: 12px 16px;
      background: var(--brown);
      color: var(--cream);
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }
    .next-slot.visible { display: flex; }
    .next-slot:hover { background: var(--orange); }
    .next-slot small {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 2px;
    }
    .next-slot b { font-weight: 600; }
    .next-slot .arrow { font-size: 18px; flex-shrink: 0; }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--brown-light);
      padding-bottom: 16px;
    }
    .month-nav button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--brown);
      padding: 4px 8px;
      line-height: 1;
      font-family: inherit;
    }
    .month-nav button:disabled { opacity: 0.2; cursor: default; }
    .month-label {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--brown);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 28px;
    }
    .cal-header {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--brown-mid);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 6px 0;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--brown);
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    /* Days with open times read as buttons: a ring + dot. Once availability has
       loaded, weekdays without times fade back like the weekends. */
    .cal-day.has-slots:not(:disabled) { font-weight: 600; background: rgba(97,65,45,0.07); position: relative; }
    .cal-day.has-slots:not(:disabled)::after {
      content: "";
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--orange);
    }
    .cal-day.has-slots.selected:not(:disabled)::after { background: var(--cream); }
    .cal-day.no-slots { color: var(--brown-light); }
    .cal-day:hover:not(:disabled) { background: var(--brown-light); }
    .cal-day.selected { background: var(--brown); color: var(--cream); }
    .cal-day.today { font-weight: 700; }
    .cal-day.selected, .cal-day.today.selected, .cal-day.has-slots.selected:not(:disabled) { background: var(--brown); color: var(--cream); }
    .cal-day:disabled { color: var(--brown-light); cursor: default; }
    .cal-day.empty { cursor: default; }

    /* ── Slots ── */
    .slots-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--brown-mid);
      margin-bottom: 12px;
    }
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 28px;
      min-height: 48px;
    }
    .slot-btn {
      padding: 10px 6px;
      border: 1px solid var(--brown-light);
      background: transparent;
      font-size: 12px;
      font-family: inherit;
      color: var(--brown);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .slot-btn:hover { border-color: var(--brown); }
    .slot-btn.selected { background: var(--brown); color: var(--cream); border-color: var(--brown); }
    .slots-empty { font-size: 13px; color: var(--brown-mid); grid-column: 1/-1; padding: 8px 0; }

    /* ── Step 2: form ── */
    .form-back {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brown-mid);
      padding: 0;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-back:hover { color: var(--brown); }

    .slot-summary {
      font-size: 13px;
      color: var(--brown);
      margin-bottom: 28px;
      padding: 12px 16px;
      background: var(--brown-light);
      border-left: 2px solid var(--orange);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }
    .field label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--brown-mid);
    }
    .field input, .field textarea, .field select {
      font-family: inherit;
      font-size: 14px;
      padding: 10px 0;
      border: none;
      border-bottom: 1px solid var(--brown-light);
      border-radius: 0;
      outline: none;
      background: transparent;
      transition: border-color 0.2s;
      width: 100%;
      color: var(--brown);
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-bottom-color: var(--brown); }
    .field input::placeholder, .field textarea::placeholder { color: var(--brown-mid); }
    .field textarea { resize: none; height: 72px; }
    .field select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2361412D' stroke-width='1.2' fill='none'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 2px center;
      padding-right: 20px;
    }

    /* Inline field validation */
    .field input.invalid, .field select.invalid { border-bottom-color: var(--orange); }
    .field-error {
      font-size: 11px;
      color: var(--orange);
      letter-spacing: 0.02em;
      display: none;
    }
    .field-error.visible { display: block; }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--orange);
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 12px;
    }
    .submit-btn:disabled { opacity: 0.3; cursor: default; }
    .submit-btn:hover:not(:disabled) { background: var(--brown); }

    .error-msg {
      font-size: 12px;
      color: var(--orange);
      margin-top: 10px;
      display: none;
      letter-spacing: 0.02em;
    }
    .error-msg.visible { display: block; }

    /* ── Step 3: success ── */
    .success {
      text-align: center;
      padding: 48px 0;
    }
    .success-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1.5px solid var(--brown);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 22px;
      color: var(--brown);
    }
    .success h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--brown);
    }
    .success p { font-size: 14px; color: var(--brown-mid); margin-bottom: 4px; }
    .success a {
      display: inline-block;
      margin-top: 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--orange);
      text-decoration: none;
    }
    .success a:hover { text-decoration: underline; }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .booking { padding: 20px 16px 32px; }
      /* Two columns of slots fit comfortably; three are too cramped to tap. */
      .slots-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .slot-btn { padding: 13px 6px; font-size: 13px; }
      /* Nombre / Apellido stack instead of squeezing side by side. */
      .field-row { grid-template-columns: 1fr; gap: 0; }
      /* 16px prevents iOS Safari from zooming in on focus. */
      .field input, .field textarea, .field select { font-size: 16px; }
      .cal-day { font-size: 14px; }
      .submit-btn { padding: 17px; }
    }
  </style>
</head>
<body>
<div class="booking">

  <!-- STEP 1: Calendar (date only) -->
  <div class="step active" id="step-1">
    <div class="hc-head">
      <h2 class="hc-title">Agendá una llamada o visita comercial al proyecto</h2>
      <p class="hc-sub">Elegí un día y un horario. Te confirmamos por mail.</p>
    </div>
    <button class="next-slot" id="next-slot" type="button"></button>
    <div class="month-nav">
      <button id="prev-month" aria-label="Mes anterior">‹</button>
      <span class="month-label" id="month-label"></span>
      <button id="next-month" aria-label="Mes siguiente">›</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </div>

  <!-- STEP 1b: Slot picker for the chosen day -->
  <div class="step" id="step-slots">
    <button class="form-back" id="btn-back-cal">← Cambiar fecha</button>
    <div class="slots-label" id="slots-day-label">Horarios disponibles</div>
    <div class="slots-grid" id="slots-grid">
      <span class="slots-empty">Seleccioná una fecha</span>
    </div>
    <button class="submit-btn" id="btn-to-form" disabled>Continuar</button>
  </div>

</div>

<script>
const API_BASE = "https://api.cs-arquitectura.com";
const TOKEN = "fb7ea7020b93b2d90f0fc357832fbe7ab20feb074ede1462aff9aac416f9257c";
const DAYS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

let currentMonth, selectedDate, selectedSlot, allSlots = {};
// Months whose availability has been fetched: monthsLoaded["2026-10"] = true.
const monthsLoaded = {};

// ── Calendar ──
function initCalendar() {
  const now = new Date(); now.setHours(0,0,0,0);
  // If today is a weekend or the last weekday of the month, start on next month
  const remaining = getRemainingWeekdays(now.getFullYear(), now.getMonth(), now);
  if (remaining === 0) {
    const next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    currentMonth = { year: next.getFullYear(), month: next.getMonth() };
  } else {
    currentMonth = { year: now.getFullYear(), month: now.getMonth() };
  }
  renderCalendar();
  maybePreselectFromURL();
  loadAvailability().then(showNextSlot);
}

// Fetch the whole visible month once and bucket it by local day, so the calendar
// can mark days with open times and the "next time" shortcut has data. Fills the
// same allSlots cache selectDate uses, so picking a day needs no second request.
async function loadAvailability(target) {
  const { year, month } = target || currentMonth;
  const monthKey = `${year}-${String(month + 1).padStart(2, "0")}`;
  if (monthsLoaded[monthKey]) return;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  try {
    const url = new URL(`${API_BASE}/api/public/v1/bookings/slots`);
    url.searchParams.set("from", shiftYMD(`${monthKey}-01`, -1));
    url.searchParams.set("to", shiftYMD(`${monthKey}-${String(daysInMonth).padStart(2, "0")}`, 1));
    const res = await fetch(url, { headers: { "X-Intake-Token": TOKEN } });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const now = Date.now();
    const byDay = {};
    for (let d = 1; d <= daysInMonth; d++) byDay[`${monthKey}-${String(d).padStart(2, "0")}`] = [];
    (data.slots || []).forEach(s => {
      const day = localYMD(s.start);
      if (s.available && byDay[day] && new Date(s.start).getTime() > now) byDay[day].push(s);
    });
    Object.entries(byDay).forEach(([day, arr]) => {
      arr.sort((a, b) => new Date(a.start) - new Date(b.start));
      allSlots[day] = arr;
    });
    monthsLoaded[monthKey] = true;
  } catch (e) {
    // Leave the month "unknown": days stay neutral and selectDate fetches per day.
    return;
  }
  if (!target) renderCalendar();
}

// Soonest open time from today on (looks one month ahead if this one is full).
async function showNextSlot() {
  const btn = document.getElementById("next-slot");
  const find = () => Object.keys(allSlots).sort()
    .map(d => (allSlots[d] || [])[0]).filter(Boolean)[0];
  let slot = find();
  if (!slot) {
    const next = new Date(currentMonth.year, currentMonth.month + 1, 1);
    await loadAvailability({ year: next.getFullYear(), month: next.getMonth() });
    slot = find();
  }
  if (!slot) return;
  const ymd = localYMD(slot.start);
  btn.innerHTML = `<span><small>Próximo horario</small><b>${capitalize(formatDateLong(ymd))} · ${formatTime(slot.start)}</b></span><span class="arrow" aria-hidden="true">→</span>`;
  btn.classList.add("visible");
  btn.onclick = () => {
    currentMonth = { year: +ymd.slice(0, 4), month: +ymd.slice(5, 7) - 1 };
    pickSlot(ymd, slot);
  };
  notifyHeight();
}

// Jump straight from a chosen day+slot to the contact form.
async function pickSlot(ymd, slot) {
  await selectDate(ymd);
  const match = (allSlots[ymd] || []).find(s => s.start === slot.start);
  if (!match) return; // gone in the meantime: stay on the slot picker
  selectedSlot = match;
  document.getElementById("btn-to-form").disabled = false;
  document.getElementById("btn-to-form").click();
}

// The hero mini-calendar sends the visitor here with ?date=YYYY-MM-DD (and
// optionally ?time=<ISO start>). Open that day, load its slots, and — if a time
// was passed and still available — preselect it and jump straight to the form.
async function maybePreselectFromURL() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get("date");
  const timeIso = params.get("time");
  if (!raw || !/^\d{4}-\d{2}-\d{2}$/.test(raw)) return;
  const [y, m, d] = raw.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  if (isNaN(date)) return;
  const today = new Date(); today.setHours(0,0,0,0);
  const isWeekend = date.getDay() === 0 || date.getDay() === 6;
  if (date < today || isWeekend) return;
  currentMonth = { year: y, month: m - 1 };
  renderCalendar();
  await selectDate(raw);

  if (!timeIso) return;
  // Match the passed slot against the ones that actually loaded; only advance if
  // it's real and still free, otherwise leave the visitor on the slot picker.
  const match = (allSlots[raw] || []).find(s => s.start === timeIso);
  if (!match) return;
  selectedSlot = match;
  document.getElementById("btn-to-form").disabled = false;
  document.getElementById("btn-to-form").click();
}

function getRemainingWeekdays(year, month, from) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let count = 0;
  for (let d = from.getDate(); d <= daysInMonth; d++) {
    const day = new Date(year, month, d).getDay();
    if (day !== 0 && day !== 6) count++;
  }
  return count;
}

function renderCalendar() {
  const { year, month } = currentMonth;
  document.getElementById("month-label").textContent = `${MONTHS[month]} ${year}`;

  const now = new Date(); now.setHours(0,0,0,0);
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // Disable prev if current month
  const isCurrentMonth = year === now.getFullYear() && month === now.getMonth();
  document.getElementById("prev-month").disabled = isCurrentMonth;

  const grid = document.getElementById("calendar-grid");
  grid.innerHTML = DAYS.map(d => `<div class="cal-header">${d}</div>`).join("");

  for (let i = 0; i < firstDay; i++) {
    grid.innerHTML += `<div class="cal-day empty"></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const isPast = date < now;
    const isToday = date.toDateString() === now.toDateString();
    const ymd = toYMD(date);
    const isSelected = selectedDate === ymd;
    const isWeekend = date.getDay() === 0 || date.getDay() === 6;

    const known = Array.isArray(allSlots[ymd]) && monthsLoaded[ymd.slice(0, 7)];
    const hasSlots = known && allSlots[ymd].length > 0;
    const noSlots = known && !hasSlots;

    grid.innerHTML += `<button class="cal-day${isToday ? " today" : ""}${hasSlots ? " has-slots" : ""}${noSlots ? " no-slots" : ""}${isSelected ? " selected" : ""}"
      ${isPast || isWeekend || noSlots ? "disabled" : ""}
      data-date="${ymd}">${d}</button>`;
  }

  grid.querySelectorAll(".cal-day[data-date]").forEach(btn => {
    btn.addEventListener("click", () => selectDate(btn.dataset.date));
  });
}

async function selectDate(ymd) {
  selectedDate = ymd;
  selectedSlot = null;
  document.getElementById("btn-to-form").disabled = true;
  renderCalendar();

  // Move to the slots step (its own screen), so the calendar screen stays short.
  document.getElementById("slots-day-label").textContent = capitalize(formatDateLong(ymd));
  showStep("step-slots");

  const grid = document.getElementById("slots-grid");
  grid.innerHTML = `<span class="slots-empty">Cargando...</span>`;

  if (!allSlots[ymd]) {
    try {
      // The API buckets slots by UTC day, but Buenos Aires is UTC-3: the local day
      // spans two UTC days. Request a window around the date and then keep only the
      // slots that actually fall on the selected LOCAL day.
      const url = new URL(`${API_BASE}/api/public/v1/bookings/slots`);
      url.searchParams.set("from", shiftYMD(ymd, -1));
      url.searchParams.set("to", shiftYMD(ymd, 1));
      const res = await fetch(url, { headers: { "X-Intake-Token": TOKEN } });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      const now = Date.now();
      allSlots[ymd] = data.slots.filter(s =>
        s.available &&
        localYMD(s.start) === ymd &&
        new Date(s.start).getTime() > now // never offer a slot in the past
      );
    } catch {
      grid.innerHTML = `<span class="slots-empty">No se pudieron cargar los horarios.</span>`;
      return;
    }
  }

  renderSlots(ymd);
}

function renderSlots(ymd) {
  const slots = allSlots[ymd] || [];
  const grid = document.getElementById("slots-grid");

  if (slots.length === 0) {
    grid.innerHTML = `<span class="slots-empty">Sin disponibilidad este día.</span>`;
    return;
  }

  grid.innerHTML = slots.map((s, i) => {
    const time = formatTime(s.start);
    const isSelected = selectedSlot && selectedSlot.start === s.start;
    return `<button class="slot-btn${isSelected ? " selected" : ""}" data-i="${i}">${time}</button>`;
  }).join("");

  grid.querySelectorAll(".slot-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedSlot = allSlots[ymd][+btn.dataset.i];
      document.getElementById("btn-to-form").disabled = false;
      grid.querySelectorAll(".slot-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
    });
  });
}

// ── Navigation ──
document.getElementById("prev-month").addEventListener("click", () => {
  currentMonth.month--;
  if (currentMonth.month < 0) { currentMonth.month = 11; currentMonth.year--; }
  renderCalendar();
  loadAvailability();
});
document.getElementById("next-month").addEventListener("click", () => {
  currentMonth.month++;
  if (currentMonth.month > 11) { currentMonth.month = 0; currentMonth.year++; }
  renderCalendar();
  loadAvailability();
});

// Back from the slots screen to the calendar.
document.getElementById("btn-back-cal").addEventListener("click", () => {
  selectedSlot = null;
  document.getElementById("btn-to-form").disabled = true;
  showStep("step-1");
});

// The hero card only picks the day and time. Everything after that (modalidad,
// datos, valores de referencia, presupuesto, confirmar) is the full wizard in
// booking.html, so hand off to it INSIDE this same iframe with the choice preloaded.
function goToWizard() {
  const q = new URLSearchParams({ date: selectedDate, time: selectedSlot.start });
  const utm = new URLSearchParams(window.location.search).get("utm_source");
  if (utm) q.set("utm_source", utm);
  window.location.href = "booking.html?" + q.toString();
}

document.getElementById("btn-to-form").addEventListener("click", () => {
  if (!selectedDate || !selectedSlot) return;
  goToWizard();
});

// ── Helpers ──
function showStep(id) {
  document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  notifyHeight();
  // Inside the Framer iframe the parent page keeps its own scroll position, so
  // bring the newly shown step into view.
  try {
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (window.parent !== window) {
      window.parent.postMessage({ type: "booking:step", step: id }, "*");
    }
  } catch (e) {}
}

// ── Framer iframe auto-height ──
// The embed is an <iframe> with a fixed height; each step has a different height,
// so publish ours and let the parent resize. Framer's Embed component listens for
// this message shape.
function notifyHeight() {
  if (window.parent === window) return;
  const h = Math.ceil(document.querySelector(".booking").getBoundingClientRect().height) + 16;
  try {
    window.parent.postMessage({ type: "booking:height", height: h }, "*");
    // iframe-resizer / Framer-compatible fallbacks
    window.parent.postMessage(`booking-height:${h}`, "*");
  } catch (e) {}
}

if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(notifyHeight).observe(document.querySelector(".booking"));
}
window.addEventListener("load", notifyHeight);
const TZ = "America/Argentina/Buenos_Aires";

// Local calendar date of a Date object — never toISOString(), which shifts to UTC.
function toYMD(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// Which Buenos Aires calendar day an ISO instant falls on.
function localYMD(iso) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
  }).format(new Date(iso));
  return parts; // en-CA formats as YYYY-MM-DD
}

function shiftYMD(ymd, days) {
  const [y, m, d] = ymd.split("-").map(Number);
  const date = new Date(y, m - 1, d + days);
  return toYMD(date);
}
function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Argentina/Buenos_Aires" });
}
function formatDateLong(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
}
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

initCalendar();
</script>

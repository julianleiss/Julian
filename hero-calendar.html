<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendá una visita — Julián</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brown: #61412D;
      --cream: #FCF2E8;
      --orange: #FE5538;
      /* Cream card, so everything is drawn in brown at varying opacity. */
      --line: rgba(97,65,45,0.15);
      --line-strong: rgba(97,65,45,0.35);
      --dim: rgba(97,65,45,0.45);
    }

    html, body { height: 100%; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Apercu Pro", "Apercu", "Inter", -apple-system, sans-serif;
      background: var(--cream);
      color: var(--brown);
      font-size: 15px;
      line-height: 1.5;
    }

    .hero-cal {
      /* Fill the iframe edge-to-edge; the embed rounds the corners so there is a
         single, even radius instead of a rounded card inside a square frame. */
      width: 100%;
      margin: 0;
      padding: 24px 22px 28px;
      background: var(--cream);
    }

    .hc-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--dim);
      margin-bottom: 18px;
    }

    /* ── Month nav ── */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }
    .month-nav button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--brown);
      padding: 4px 8px;
      line-height: 1;
      font-family: inherit;
    }
    .month-nav button:disabled { opacity: 0.2; cursor: default; }
    .month-label {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--brown);
    }

    /* ── Grid ── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-header {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 6px 0;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--brown);
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
      position: relative;
    }
    .cal-day:hover:not(:disabled) { background: rgba(97,65,45,0.12); }
    /* A dot under the number marks days that have open slots. */
    .cal-day.has-slots::after {
      content: "";
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--orange);
    }
    .cal-day.today { font-weight: 700; color: var(--orange); }
    .cal-day.selected { background: var(--brown); color: var(--cream); }
    .cal-day.selected::after { background: var(--cream); }
    .cal-day:disabled { color: rgba(97,65,45,0.2); cursor: default; }
    .cal-day.empty { cursor: default; }

    .hc-hint {
      margin-top: 16px;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.02em;
      min-height: 16px;
    }

    /* ── Slots (shown once a day is picked) ── */
    .slots-wrap {
      margin-top: 18px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      display: none;
    }
    .slots-wrap.visible { display: block; }
    .slots-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--dim);
      margin-bottom: 12px;
    }
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      min-height: 42px;
    }
    .slot-btn {
      padding: 10px 6px;
      border: 1px solid var(--line);
      background: transparent;
      font-size: 12px;
      font-family: inherit;
      color: var(--brown);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      text-align: center;
      letter-spacing: 0.02em;
      border-radius: 4px;
    }
    .slot-btn:hover { border-color: var(--brown); }
    .slots-empty { font-size: 12px; color: var(--dim); grid-column: 1/-1; padding: 6px 0; }

    /* Mobile: the calendar is replaced in Framer by a button, but if this file is
       ever shown directly on a small screen, keep it legible. */
    @media (max-width: 420px) {
      .hero-cal { max-width: 100%; padding: 18px 14px 22px; }
      .cal-day { font-size: 14px; }
      .slots-grid { grid-template-columns: repeat(2, 1fr); }
      .slot-btn { padding: 12px 6px; font-size: 13px; }
    }
  </style>
</head>
<body>
<div class="hero-cal">
  <div class="hc-title">Agendá una visita</div>

  <div class="month-nav">
    <button id="prev-month" aria-label="Mes anterior">‹</button>
    <span class="month-label" id="month-label"></span>
    <button id="next-month" aria-label="Mes siguiente">›</button>
  </div>

  <div class="calendar-grid" id="calendar-grid"></div>

  <div class="hc-hint" id="hc-hint">Elegí un día para ver horarios.</div>

  <div class="slots-wrap" id="slots-wrap">
    <div class="slots-label" id="slots-label">Horarios disponibles</div>
    <div class="slots-grid" id="slots-grid"></div>
  </div>
</div>

<script>
const API_BASE = "https://api.cs-arquitectura.com";
const TOKEN = "fb7ea7020b93b2d90f0fc357832fbe7ab20feb074ede1462aff9aac416f9257c";
const DAYS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const TZ = "America/Argentina/Buenos_Aires";

// Where the full booking widget lives on the site. Choosing a time sends the
// visitor here (with ?date & ?time so the widget preselects day + slot).
const AGENDAR_HASH = "#agendar";

let currentMonth, selectedDate = null;
// Per-month cache of the open slots, keyed by local day:
// slotsByMonth["2026-09"] = { "2026-09-10": [slot, ...], ... }.
// A day is "available" iff its array is present and non-empty.
const slotsByMonth = {};

// ── Calendar ──
function initCalendar() {
  const now = new Date(); now.setHours(0,0,0,0);
  // If no weekdays remain this month, start on the next one — same rule the full
  // widget uses, so the two calendars agree on the first bookable month.
  const remaining = getRemainingWeekdays(now.getFullYear(), now.getMonth(), now);
  if (remaining === 0) {
    const next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    currentMonth = { year: next.getFullYear(), month: next.getMonth() };
  } else {
    currentMonth = { year: now.getFullYear(), month: now.getMonth() };
  }
  renderCalendar();
  loadAvailability();
}

function getRemainingWeekdays(year, month, from) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let count = 0;
  for (let d = from.getDate(); d <= daysInMonth; d++) {
    const day = new Date(year, month, d).getDay();
    if (day !== 0 && day !== 6) count++;
  }
  return count;
}

function renderCalendar() {
  const { year, month } = currentMonth;
  document.getElementById("month-label").textContent = `${MONTHS[month]} ${year}`;

  const now = new Date(); now.setHours(0,0,0,0);
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const isCurrentMonth = year === now.getFullYear() && month === now.getMonth();
  document.getElementById("prev-month").disabled = isCurrentMonth;

  const monthKey = `${year}-${String(month + 1).padStart(2, "0")}`;
  const byDay = slotsByMonth[monthKey];

  const grid = document.getElementById("calendar-grid");
  grid.innerHTML = DAYS.map(d => `<div class="cal-header">${d}</div>`).join("");

  for (let i = 0; i < firstDay; i++) {
    grid.innerHTML += `<div class="cal-day empty"></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const isPast = date < now;
    const isToday = date.toDateString() === now.toDateString();
    const ymd = toYMD(date);
    const isWeekend = date.getDay() === 0 || date.getDay() === 6;
    const hasSlots = byDay ? (byDay[ymd] || []).length > 0 : false;
    const isSelected = selectedDate === ymd;

    grid.innerHTML += `<button class="cal-day${isToday ? " today" : ""}${hasSlots ? " has-slots" : ""}${isSelected ? " selected" : ""}"
      ${isPast || isWeekend ? "disabled" : ""}
      data-date="${ymd}">${d}</button>`;
  }

  grid.querySelectorAll(".cal-day[data-date]").forEach(btn => {
    btn.addEventListener("click", () => selectDay(btn.dataset.date));
  });
}

// ── Day picked → show that day's slots inline ──
async function selectDay(ymd) {
  selectedDate = ymd;
  renderCalendar(); // reflect the .selected ring

  const wrap = document.getElementById("slots-wrap");
  const grid = document.getElementById("slots-grid");
  const hint = document.getElementById("hc-hint");
  hint.textContent = capitalize(formatDateLong(ymd));
  wrap.classList.add("visible");
  grid.innerHTML = `<span class="slots-empty">Cargando horarios…</span>`;

  const monthKey = ymd.slice(0, 7);
  // Slots for the whole month are usually already loaded (availability pass); if a
  // month was never fetched, load it now.
  if (!slotsByMonth[monthKey]) await loadAvailability();
  const slots = (slotsByMonth[monthKey] || {})[ymd] || [];

  if (slots.length === 0) {
    grid.innerHTML = `<span class="slots-empty">Sin disponibilidad este día.</span>`;
    notifyHeight();
    return;
  }

  grid.innerHTML = slots.map((s, i) =>
    `<button class="slot-btn" data-i="${i}">${formatTime(s.start)}</button>`
  ).join("");
  grid.querySelectorAll(".slot-btn").forEach(btn => {
    btn.addEventListener("click", () => goToAgendar(ymd, slots[+btn.dataset.i].start));
  });
  notifyHeight();
  scrollToSlots();
}

// Bring the slot list into view. The iframe grows via notifyHeight, but the parent
// page keeps its own scroll position, so also nudge the parent to reveal it.
function scrollToSlots() {
  const wrap = document.getElementById("slots-wrap");
  try { wrap.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
  // Ask the Framer parent to scroll the iframe into view once it has resized.
  try {
    if (window.parent !== window) {
      window.parent.postMessage({ type: "hero:reveal-slots" }, "*");
    }
  } catch (e) {}
}

// Fetch the whole visible month's slots once, bucketed by local day. Used both
// for the availability dots and for the inline slot list when a day is picked.
async function loadAvailability() {
  const { year, month } = currentMonth;
  const monthKey = `${year}-${String(month + 1).padStart(2, "0")}`;
  if (slotsByMonth[monthKey]) { renderCalendar(); return; }

  const first = `${monthKey}-01`;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const last = `${monthKey}-${String(daysInMonth).padStart(2, "0")}`;

  try {
    // Pad ±1 day for the UTC/BA offset, exactly like the full widget.
    const url = new URL(`${API_BASE}/api/public/v1/bookings/slots`);
    url.searchParams.set("from", shiftYMD(first, -1));
    url.searchParams.set("to", shiftYMD(last, 1));
    const res = await fetch(url, { headers: { "X-Intake-Token": TOKEN } });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const now = Date.now();
    const byDay = {};
    (data.slots || []).forEach(s => {
      if (s.available && new Date(s.start).getTime() > now) {
        const day = localYMD(s.start);
        (byDay[day] || (byDay[day] = [])).push(s);
      }
    });
    // Keep each day's slots in chronological order.
    Object.values(byDay).forEach(arr => arr.sort((a, b) => new Date(a.start) - new Date(b.start)));
    slotsByMonth[monthKey] = byDay;
  } catch {
    // On error cache an empty map so we don't refetch on every re-render; the
    // day still opens and shows "sin disponibilidad".
    slotsByMonth[monthKey] = {};
  }
  renderCalendar();
}

// ── Navigation between months ──
document.getElementById("prev-month").addEventListener("click", () => {
  currentMonth.month--;
  if (currentMonth.month < 0) { currentMonth.month = 11; currentMonth.year--; }
  resetSelection();
  renderCalendar();
  loadAvailability();
});
document.getElementById("next-month").addEventListener("click", () => {
  currentMonth.month++;
  if (currentMonth.month > 11) { currentMonth.month = 0; currentMonth.year++; }
  resetSelection();
  renderCalendar();
  loadAvailability();
});

// Changing month clears the open slot list — its day no longer belongs to the view.
function resetSelection() {
  selectedDate = null;
  document.getElementById("slots-wrap").classList.remove("visible");
  document.getElementById("hc-hint").textContent = "Elegí un día para ver horarios.";
}

// ── Time chosen → hand off to the full widget ──
// This file lives in an iframe inside the Framer hero. Picking a time takes the
// whole page (not the iframe) to the #agendar section, carrying day + time so the
// full widget opens straight on the contact form.
function goToAgendar(ymd, startIso) {
  const params = `date=${ymd}` + (startIso ? `&time=${encodeURIComponent(startIso)}` : "");
  const target = AGENDAR_HASH + "?" + params;
  try {
    if (window.parent !== window) {
      window.parent.postMessage({ type: "hero:agendar", date: ymd, time: startIso || null }, "*");
      // Fallback: drive the top window's hash directly (works same-origin or when
      // the parent allows it; harmless otherwise).
      try { window.top.location.hash = target.slice(1); } catch (e) {}
    } else {
      window.location.hash = target.slice(1);
    }
  } catch (e) {
    window.location.href = "/" + target;
  }
}

// ── Framer iframe auto-height ──
function notifyHeight() {
  if (window.parent === window) return;
  const h = Math.ceil(document.querySelector(".hero-cal").getBoundingClientRect().height) + 8;
  try {
    window.parent.postMessage({ type: "booking:height", height: h }, "*");
    window.parent.postMessage(`booking-height:${h}`, "*");
  } catch (e) {}
}
if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(notifyHeight).observe(document.querySelector(".hero-cal"));
}
window.addEventListener("load", notifyHeight);

// ── Helpers (identical semantics to booking.html) ──
function toYMD(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function localYMD(iso) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
  }).format(new Date(iso)); // en-CA formats as YYYY-MM-DD
}
function shiftYMD(ymd, days) {
  const [y, m, d] = ymd.split("-").map(Number);
  const date = new Date(y, m - 1, d + days);
  return toYMD(date);
}
function formatTime(iso) {
  return new Date(iso).toLocaleTimeString("es-AR", {
    hour: "2-digit", minute: "2-digit", timeZone: TZ,
  });
}
function formatDateLong(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("es-AR", {
    weekday: "long", day: "numeric", month: "long",
  });
}
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

initCalendar();
</script>
</body>
</html>
